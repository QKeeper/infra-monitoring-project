services:
  api:
    image: hashicorp/http-echo
    command: ["-listen=:8080", "-text=Monitoring Service Active"]
    expose:
      - "8080"
    networks:
      - monitoring
  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
